# 매일 KST 새벽 배치 (HANDOFF 3장, ops config 1.1).
# 1) 어제(KST 기준) D 목록으로 새 다이제스트, 2) 그 전날 D-1 목록 다시 받아 보충(늦게 온 논문·해설 준비 중 재시도),
# 3) 용어집 LLM 작업(대응어·정식 명칭 초안, 번역문 표기 위치). 3은 늦거나 실패해도 1·2에 영향 없고 다음 날 이어서 한다.
# 4) official-news 잡: 공식 소식·HF 트렌딩 모델 수집(worker/official_news.py). 논문 잡이 끝난 뒤 돌린다
#    (같은 LLM 키를 동시에 쓰면 요청 한도에 걸려 논문 해설이 늦어진다). 실패해도 논문에는 영향이 없다.
# 비밀값: DEEPSEEK_API_KEY(운영 LLM), SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (Repository secrets).
# NVIDIA_API_KEY는 DeepSeek 키가 없을 때만 쓰는 개발용이다(약관상 결과를 외부에 보여 주면 안 된다, worker/llm.py).
# 실제 초록·번역이 담긴 worker/out은 아티팩트로 올리지 않는다(공개 레포, HANDOFF 0.1).
name: daily-batch

on:
  schedule:
    # 정시 시작은 Supabase pg_cron이 KST 05:00(HF 하루 목록이 대부분 찬 뒤)에 workflow_dispatch로 한다
    # (20261103090000_cron_dispatch.sql). GitHub 예약은 붐비면 3~6시간 늦게 시작해서(KST 02:17 예약이 11-03 08:52)
    # 아래는 그게 실패했을 때의 예비다. 이미 처리한 날짜면 몇 분 만에 끝난다.
    # UTC 21:17 = KST 06:17. 정시 실행보다 먼저 돌면 늦게 올라온 논문이 빠지므로(노출 상위 10편은 첫 실행 때 정해진다)
    # 그 뒤에 둔다. KST 자정 전으로는 옮기지 않는다(「KST 어제」 D가 하루 앞당겨진다).
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "UTC 날짜 D (YYYY-MM-DD). 비우면 KST 기준 어제"
        required: false

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r worker/requirements.txt
      - name: 새 다이제스트 (D)
        timeout-minutes: 80 # 예비 모델 전환 시 1시간 안팎(ops config 1.1)
        run: |
          D="${{ inputs.date }}"
          D="${D:-$(TZ=Asia/Seoul date -d yesterday +%F)}"
          echo "D=$D" >> "$GITHUB_ENV"
          python -m worker.run --date "$D"
      - name: 보충 (D-1)
        if: always()
        timeout-minutes: 45
        run: python -m worker.run --date "$(date -d "$D -1 day" +%F)"
      - name: 용어집 LLM 작업
        if: always()
        timeout-minutes: 35
        continue-on-error: true # 끊겨도 저장된 것까지는 남고, 다음 날 이어서 한다
        run: python -m worker.glossary sync

  official-news:
    needs: batch
    if: always() # 논문 잡이 실패해도 돌린다
    runs-on: ubuntu-latest
    # 처음 한 번은 캐시가 비어 40분대(사이트맵 페이지·요약을 모두 새로). 이후는 새 글만이라 몇 분.
    timeout-minutes: 75
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }} # GitHub 검색 한도(분당 10 → 30번). 저장소 읽기 권한만
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r worker/requirements.txt
      - name: 공식 소식·트렌딩 모델
        run: python -m worker.official_news
