<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="kit.js"></script>
<style>
  .grp { padding: 0 20px; margin: 28px 0 8px; font: 600 13px/1 var(--sans); color: var(--mute); }
  .set { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px 0 20px; border-top: 1px solid var(--line); font: 500 16px/22px var(--sans); }
  .set:first-child { border-top: 0; }
  .set .v { color: var(--mute); font-size: 14.5px; }
  .ic { width: 32px; height: 32px; border-radius: 9px; background: var(--fill); display: flex; align-items: center; justify-content: center; flex: none; }
</style></head><body>
<div class="screen" data-tab="3"><div class="scroll">
  <div class="px" style="height:52px"><div class="display">설정</div></div>

  <div class="grp">읽기</div>
  <div class="card">
    <div class="set"><span class="ic"><span data-i="type" class="s"></span></span><span class="grow">읽기 설정</span><span class="v">함께 · 기본</span><span data-i="chev" class="s faint"></span></div>
  </div>
  <div class="grp">안내</div>
  <div class="card">
    <div class="set"><span class="ic"><span data-i="bell" class="s"></span></span><span class="grow">공지사항</span><span class="dot"></span><span data-i="chev" class="s faint"></span></div>
    <div class="set"><span class="ic"><span data-i="spark" class="s"></span></span><span class="grow">AI 생성 안내</span><span data-i="chev" class="s faint"></span></div>
    <div class="set"><span class="ic"><span data-i="layers" class="s"></span></span><span class="grow">데이터 출처</span><span data-i="chev" class="s faint"></span></div>
  </div>
  <div class="grp">정보</div>
  <div class="card">
    <div class="set"><span class="ic"><span data-i="file" class="s"></span></span><span class="grow">개인정보 처리방침</span><span data-i="chev" class="s faint"></span></div>
    <div class="set"><span class="ic"><span data-i="quote" class="s"></span></span><span class="grow">문의하기</span><span class="v">help.rootgist@gmail.com</span></div>
    <div class="set"><span class="ic"><span data-i="info" class="s"></span></span><span class="grow">앱 버전</span><span class="v">1.0.0</span></div>
  </div>
</div></div></body></html>
