<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 차콜 카드 위 주제 칩 비교(2026-10-29): 흰 14% / 흰 24% / 외곽선 / 흰 바탕 + 검정 글자. -->
<style>
  @font-face { font-family: P; font-weight: 400; src: url(../../assets/fonts/Pretendard-Regular.otf); }
  @font-face { font-family: P; font-weight: 500; src: url(../../assets/fonts/Pretendard-Medium.otf); }
  @font-face { font-family: P; font-weight: 600; src: url(../../assets/fonts/Pretendard-SemiBold.otf); }
  @font-face { font-family: P; font-weight: 700; src: url(../../assets/fonts/Pretendard-Bold.otf); }
  @font-face { font-family: P; font-weight: 800; src: url(../../assets/fonts/Pretendard-Bold.otf); }
  :root { --bg:#FFFFFF; --card:#F4F4F2; --fill:#E7E7E3; --line:#E6E6E3; --div:#E3E3E0; --ink:#0E0E0D; --ink2:#33332F; --mute:#6B6B65; --faint:#9B9B94; --newt:#D42A20;
          --an:#B5522B; --oa:#0E0E0D; --gg:#1A66D9; --hf:#FFD21E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 2620px; background: #E9E9E6; font-family: P, sans-serif; color: var(--ink); padding: 44px 44px 56px; word-break: keep-all; }
  h1 { font: 800 34px/1.2 P; letter-spacing: -0.8px; }
  .lead { margin-top: 10px; font: 400 17px/1.55 P; color: var(--mute); max-width: 1500px; }
  .grid { display: flex; gap: 26px; margin-top: 30px; }
  .col { width: 402px; }
  .label { font: 700 18px/1 P; } .sub { margin-top: 6px; font: 400 14px/1.4 P; color: var(--mute); }
  .phone { margin-top: 12px; height: 874px; background: var(--bg); border-radius: 44px; border: 6px solid #141413; overflow: hidden; position: relative; }
  .status { height: 54px; }
  .top { padding: 4px 20px 0; }
  .display { font: 800 34px/40px P; letter-spacing: -1px; }
  .seg { margin: 12px 20px 0; height: 46px; padding: 4px; border-radius: 999px; background: var(--fill); display: flex; gap: 2px; }
  .seg span { flex: 1; border-radius: 999px; display: flex; align-items: center; justify-content: center; font: 500 14.5px/1 P; color: var(--mute); }
  .seg span.on { background: #fff; color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .utabs { margin: 12px 20px 0; display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
  .utabs span { padding: 12px 0; font: 500 16px/1 P; color: var(--mute); }
  .utabs span.on { font-weight: 700; color: var(--ink); border-bottom: 2px solid var(--ink); margin-bottom: -1px; }
  .filters { display: flex; gap: 8px; padding: 14px 20px 0; overflow: hidden; }
  .f { height: 36px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line); display: inline-flex; align-items: center; font: 500 14px/1 P; color: var(--ink2); white-space: nowrap; }
  .f.on { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .sec { padding: 26px 20px 10px; display: flex; align-items: baseline; gap: 6px; }
  .sec b { font: 700 18px/25px P; letter-spacing: -0.3px; } .sec small { font: 500 14px/1 P; color: var(--mute); }
  .card { margin: 12px 16px 0; background: var(--card); border-radius: 22px; }
  .dark { margin: 18px 16px 0; background: var(--ink); color: #fff; border-radius: 26px; padding: 22px; }
  .dark .m { font: 400 14px/20px P; color: #B9B9B2; }
  .row { display: flex; gap: 12px; padding: 15px 12px 15px 20px; border-top: 1px solid var(--div); align-items: flex-start; }
  .card .row:first-child { border-top: 0; }
  .bare .row { margin: 0 20px; padding: 15px 0; }
  .bare .row:first-child { border-top: 0; }
  .grow { flex: 1; min-width: 0; }
  .head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font: 400 13.5px/19px P; color: var(--mute); }
  .new { font: 700 12px/1 P; color: var(--newt); }
  .t { margin-top: 6px; font: 600 16.5px/24px P; letter-spacing: -0.3px; }
  .s { margin-top: 4px; font: 400 14.5px/22px P; color: var(--ink2); }
  /* 칩: 높이 24, 알약, 12.5 600. 출처는 회사 대표 색, 주제·종류는 중립 */
  .chip { height: 24px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; font: 600 12.5px/1 P; white-space: nowrap; background: var(--fill); color: var(--ink2); }
  .chip.an { background: var(--an); color: #fff; } .chip.oa { background: var(--oa); color: #fff; }
  .chip.gg { background: var(--gg); color: #fff; } .chip.hf { background: var(--hf); color: var(--ink); }
  .chip.ink { background: rgba(255,255,255,.14); color: #fff; }
  .tag { height: 24px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; font: 500 12.5px/1 P; background: var(--fill); color: var(--ink2); }
  .bm { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; margin-top: -4px; }
  .bm i { width: 36px; height: 36px; border-radius: 50%; background: var(--fill); display: flex; align-items: center; justify-content: center; }
  .bm.on i { background: var(--ink); }
  .bm svg { width: 16px; height: 16px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linejoin: round; }
  .bm.on svg { stroke: #fff; fill: #fff; }
  .rank { width: 30px; flex: none; font: 800 28px/30px P; letter-spacing: -1px; color: var(--faint); }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #fff; border-top: 1px solid var(--line); display: flex; padding-top: 8px; }
  .tabbar span { flex: 1; text-align: center; font: 500 13px/1 P; color: var(--mute); }
  .tabbar span.on { color: var(--ink); font-weight: 700; }
  .tabbar span::before { content: ''; display: block; width: 22px; height: 22px; margin: 0 auto 6px; border-radius: 6px; border: 1.8px solid currentColor; }
  .toast { position: absolute; left: 16px; right: 16px; bottom: 100px; height: 52px; border-radius: 16px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font: 500 14.5px/1 P; }
  .toast b { font-weight: 700; }
  .more { display: flex; justify-content: flex-end; padding: 8px 20px 0; }
  .pill { height: 34px; padding: 0 14px; border-radius: 999px; background: var(--fill); display: inline-flex; align-items: center; gap: 4px; font: 600 14px/1 P; }
  /* 모션 판 */
  .motion { margin-top: 36px; background: #fff; border-radius: 28px; padding: 28px 30px 30px; }
  .motion h2 { font: 700 22px/1.2 P; }
  .mgrid { margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 26px; }
  .m h3 { font: 700 16px/1.3 P; } .m p { margin-top: 4px; font: 400 14px/1.5 P; color: var(--mute); }
  .frames { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
  .fr { width: 236px; background: var(--card); border-radius: 16px; padding: 10px 6px; position: relative; }
  .fr .cap { position: absolute; top: -9px; left: 10px; background: #fff; padding: 0 6px; font: 600 11.5px/18px P; color: var(--mute); border-radius: 6px; }
  .arrow { color: var(--faint); font: 700 18px/1 P; }
  .rules { margin-top: 20px; font: 400 14.5px/1.6 P; color: var(--ink2); }
  .rules b { font-weight: 700; }
</style>
<style>
  body { width: 2260px; }
  .phone { height: 760px; }
  .dark.D { background: #E9E9E5; color: var(--ink); }
  .dark.D .m { color: var(--mute); }
  .dark.D .chip.ink { background: rgba(14,14,13,.08); color: var(--ink2); }
  .dark .bmk { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; }
  .dark.D .bmk { background: rgba(14,14,13,.08); }
  .dark .bmk svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; stroke-linejoin: round; }
  .dark.D .bmk svg { stroke: var(--ink); }
  .bul { display:flex; gap:10px; font: 400 14.5px/22px P; color: #E4E4DF; margin-top: 6px; }
  .dark.D .bul { color: var(--ink2); }
  .bul::before { content:''; width:4px; height:4px; border-radius:50%; background: currentColor; margin-top: 9px; flex:none; opacity:.7; }
  .chip.ink.CHIP2 { background: rgba(255,255,255,.24); }
  .chip.ink.CHIP3 { background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }
  .chip.ink.CHIP4 { background: #FFFFFF; color: var(--ink); }
  body { width: 1820px; }
</style></head><body>
<h1>차콜 카드 위 주제 칩 비교</h1>
<div class="lead">카드 면은 모두 A 차콜 #2B2B29. 「언어 모델」 칩만 네 가지로 바꿨어요. 칩 대비는 칩과 카드 면의 밝기 차이예요(3:1 이상이면 칩 모양이 또렷하게 보여요).</div>
<div class="grid" id="grid"></div>
<script>
const BM = (on) => `<span class="bm ${on ? 'on' : ''}"><i><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></i></span>`;
const row = (chip, head, title, on) => `<div class="row"><div class="grow"><div class="head">${chip ? `<span class="chip">${chip}</span>` : ''}<span>${head}</span></div><div class="t">${title}</div></div>${BM(on)}</div>`;
const opts = [
  ['① 지금 · 흰 14%', '#2B2B29', 'CHIP1', ''],
  ['② 흰 24%', '#2B2B29', 'CHIP2', ''],
  ['③ 외곽선', '#2B2B29', 'CHIP3', ''],
  ['④ 흰 바탕 + 검정 글자 (추천)', '#2B2B29', 'CHIP4', ''],
];
document.getElementById('grid').innerHTML = opts.map(([l, c, sub, v]) => `<div class="col"><div class="label">${l}</div><div class="sub">${({CHIP1:'칩 대비 1.6:1 · 흰 글자 9.0:1', CHIP2:'칩 대비 2.2:1 · 흰 글자 6.5:1', CHIP3:'외곽선 대비 4.7:1 · 흰 글자 14.2:1', CHIP4:'칩 대비 14.2:1 · 검정 글자 19.3:1'})[sub]}</div>
  <div class="phone"><div class="status"></div>
    <div class="top"><div style="font:800 15px/1 P;letter-spacing:.22em">ROOTGIST</div>
    <div style="margin-top:20px;font:500 15px/1 P;color:var(--mute)">10월 19일 월요일</div><div class="display" style="margin-top:8px">새 논문 6편이<br>올라왔어요</div></div>
    <div class="dark ${v}" style="${v ? '' : 'background:' + c}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="display:flex;gap:8px;align-items:center;margin-top:6px"><span class="chip ink ${sub}">언어 모델</span><span class="m">오늘의 주요 논문</span></div><span class="bmk"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span></div>
      <div style="margin-top:8px;font:700 21px/29px P;letter-spacing:-.4px">추론 시점 연산의 효율적 확장</div><div class="m" style="margin-top:6px">Author 01 외 · 2026.10.18</div>
      <div style="margin-top:12px"><div class="bul">입력 복잡도에 따른 추론 연산의 동적 배분</div><div class="bul">고정 연산 예산 방식과의 비교 평가</div></div></div>
    <div class="bare" style="margin-top:6px">${row('', '2026.10.18 · Author 01 외', 'Benchmarking Long-Context Retrieval', false)}${row('멀티모달', '2026.10.18 · Author 01 외', '소수 예시 기반 영상 분할의 일반화 성능 분석', true)}</div>
    <div class="more"><span class="pill">논문 6편 모두 보기 ›</span></div>
    <div class="filters" style="padding-top:18px"><span class="f on">전체</span><span class="f">언어 모델</span><span class="f">에이전트</span></div>
    ${'<div class="tabbar">' + ['홈','탐색','보관함','설정'].map((t,k)=>`<span class="${k===0?'on':''}">${t}</span>`).join('') + '</div>'}
  </div></div>`).join('');
</script></body></html>
