<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><script src="kit.js"></script>
<style>

  .quote { margin-top: 18px; padding: 18px 18px 18px 20px; border-radius: 18px; background: var(--paper); border-left: 3px solid var(--ink); border-radius: 4px 18px 18px 4px; }
</style></head><body>
<div class="screen"><div class="scroll" style="padding-top:54px">
  <div class="topbar"><span class="back"><span data-i="back"></span></span></div>
  <div class="px mt8"><div class="t-xl">추론 시점 연산의<br>효율적 확장</div></div>
  <div class="card pad mt24">
    <div class="t-m">핵심 내용</div>
    <div class="kp" style="border-top:0"><span class="n">1</span><div class="body" style="color:var(--ink)">입력 복잡도에 따른 추론 연산의 동적 배분</div></div>

  </div>
</div>
<div class="scrim"></div>
<div class="sheet">
  <div class="grab"></div>
  <div class="meta">핵심 내용 1의 근거</div>
  <div class="t-l mt4">초록 2번째 문장</div>
  <div class="quote">
    <div class="serif" style="font-size:17px;line-height:27px;color:var(--ink)">We propose a method that dynamically allocates inference compute according to input complexity.</div>
    <div class="body mt12">본 연구는 입력 복잡도에 따라 추론 연산을 동적으로 배분하는 방법을 제안한다.</div>
  </div>
  <div class="row between mt20">
    <span class="pill soft" style="height:44px;padding:0 18px"><span data-i="book" class="s"></span>초록 전체에서 보기</span>
  </div>
</div>
